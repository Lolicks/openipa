[package]
name = "openipa"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Independent iOS build system for Linux — analyze Xcode projects, compile ARM64 Mach-O, package unsigned IPA"
authors = ["OpenIPA contributors"]
repository = "https://example.invalid/openipa"

[[bin]]
name = "openipa"
path = "src/main.rs"

[lib]
name = "openipa"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "color", "string"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = { version = "1.7", features = ["serde"] }
zip = { version = "2.1", default-features = false, features = ["deflate"] }
anyhow = "1.0"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
which = "7.0"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
